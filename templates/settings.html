{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}

<h1>⚙️ Settings</h1>

<div class="panel glass form-card">
  <form method="POST">
    <label>Name</label>
    <input type="text" name="name" value="{{ user.name }}" required>

    <label>Email</label>
    <input type="email" value="{{ user.email }}" disabled>

    <label>Currency Symbol</label>
    <select name="currency">
      {% for sym in ['₹','$','€','£'] %}
        <option value="{{ sym }}" {{ 'selected' if user.currency == sym }}>{{ sym }}</option>
      {% endfor %}
    </select>

    <label>Daily Spending Limit</label>
    <input type="number" step="0.01" min="0" name="daily_limit" value="{{ user.daily_limit }}">

    <hr>
    <h3>🎯 Savings Goal</h3>
    <label>Goal Name</label>
    <input type="text" name="savings_goal_name" value="{{ user.savings_goal_name }}" placeholder="e.g. Buy Laptop">
    <label>Goal Amount</label>
    <input type="number" step="0.01" min="0" name="savings_goal_amount" value="{{ user.savings_goal_amount }}">
    <label>Amount Saved So Far</label>
    <input type="number" step="0.01" min="0" name="savings_saved" value="{{ user.savings_saved }}">

    <button type="submit" class="btn-primary">Save Settings</button>
  </form>
</div>

<div class="panel glass">
  <h3>🌙 Appearance</h3>
  <p>Use the moon/sun icon in the top navigation bar to toggle dark mode. Your preference is remembered on this device.</p>
</div>

{% endblock %}
